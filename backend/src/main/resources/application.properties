spring.application.name=pixelmeet-api
server.port=8080

# --- Base de datos (MySQL). En Docker los valores llegan por variables de entorno ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pixelmeet?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:pixelmeet}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- JWT ---
# Clave HMAC en Base64 (>= 256 bits). Generar con: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.jwt.issuer=pixelmeet-api

# --- Proteccion de login ---
app.login.max-intentos=5
app.login.bloqueo-minutos=5

# --- Usuarios iniciales (solo se crean si la tabla esta vacia) ---
app.seed.admin-password=${SEED_ADMIN_PASSWORD:Admin123!}
app.seed.gamer-password=${SEED_GAMER_PASSWORD:Gamer123!}

# --- Errores: sin trazas ni mensajes internos ---
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false

spring.jackson.time-zone=America/Santiago
