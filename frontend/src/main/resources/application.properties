spring.application.name=pixelmeet-web

# Ruta base del sitio: la pauta pide http://[IP]/recetas
server.servlet.context-path=/recetas
server.port=${SERVER_PORT:8081}

# --- API backend ---
app.api.base-url=${API_BASE_URL:http://localhost:8080}
app.api.connect-timeout-ms=3000
app.api.read-timeout-ms=10000

# --- HTTPS (activado en Docker con SSL_ENABLED=true) ---
# El conector principal atiende HTTPS en 8443 y un conector HTTP en 8080 solo redirige a HTTPS.
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE:classpath:no-existe.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=pixelmeet
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
app.https.enabled=${SSL_ENABLED:false}
app.https.http-port=${HTTP_PORT:8080}
app.https.https-port=${SERVER_PORT:8443}

# --- Cookie de sesion (el JWT queda en la sesion del servidor, nunca en el navegador) ---
server.servlet.session.cookie.name=PIXELMEET_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SSL_ENABLED:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie

# --- Thymeleaf ---
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# --- Errores: no exponer trazas ni mensajes internos ---
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false
server.server-header=
